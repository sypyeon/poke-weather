<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포켓몬 날씨</title>

  <!-- 웹폰트: 큰 숫자/제목용 Do Hyeon, 본문용 Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" />

  <style>
    /* 7단계: CSS 변수
       --bg, --accent는 날씨에 따라 JS가 바꿔요.
       이 변수를 쓰는 모든 곳의 색이 한 번에 바뀌어요. */
    :root {
      --bg: #FFF4E0;
      --accent: #C2410C;
      --text: #1F2328;
      --muted: #4A515B;
      --line: #C9CED6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      transition: background 0.4s;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* 상단: 제목 + 검색 */
    .top {
      display: flex;
      flex-wrap: wrap;            /* 좁아지면 검색창이 아래 줄로 내려가요 */
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      font-weight: 400;
      font-size: 32px;
    }

    .search-area {
      position: relative;         /* 검색 결과 목록의 기준 위치 */
      flex: 0 1 440px;
      min-width: 0;
    }

    .search { display: flex; gap: 8px; }

    .search input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #FFFFFF;
      font: inherit;
      font-size: 15px;
    }

    .btn-search {
      height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 22px;
      background: var(--accent);
      color: #FFFFFF;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 검색 결과: 검색창 아래에 떠 있는 목록 */
    .results {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      margin: 0;
      padding: 6px;
      list-style: none;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }
    .results:empty { display: none; }   /* 비어 있으면 숨기기 */
    .results li.msg { padding: 10px 12px; color: var(--muted); }
    .results button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      background: none;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .results button:hover { background: var(--bg); }

    /* 본문: 날씨 블록 + 포켓몬 블록 */
    .panels {
      display: flex;
      flex-wrap: wrap;            /* 화면이 좁으면 위아래로 쌓여요 */
      gap: 24px;
      align-items: stretch;       /* 두 블록 높이 맞추기 */
    }

    .weather-card {
      flex: 1 1 360px;
      min-width: 0;
      padding: 40px;
      border-radius: 32px;
      background: var(--accent);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: background 0.4s;
    }
    .weather-card p { margin: 0; }
    .location { font-size: 20px; font-weight: 500; }
    .temp {
      font-family: 'Do Hyeon', sans-serif;
      font-size: clamp(96px, 14vw, 160px); /* 화면 너비에 따라 96~160px */
      line-height: 1;
    }
    .label {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 56px;
      line-height: 1.2;
    }
    .hint { margin-top: 12px !important; font-size: 17px; }
    .odds {
      margin-top: 16px !important;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      font-size: 15px;
      line-height: 1.6;
    }

    .pokemon-card {
      flex: 1 1 420px;
      min-width: 0;
      padding: 40px;
      border-radius: 32px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .poke-image {
      width: 300px;
      max-width: 100%;
      aspect-ratio: 1;
      border-radius: 28px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: background 0.4s;
    }
    .poke-image img {
      width: 60%;
      height: 60%;
      object-fit: contain;
      image-rendering: pixelated; /* 도트를 키워도 흐려지지 않게 */
    }
    .poke-image img:not([src]) { display: none; } /* 이미지 없을 땐 숨기기 */

    .poke-name {
      margin: 0;
      font-family: 'Do Hyeon', sans-serif;
      font-weight: 400;
      font-size: 44px;
      text-align: center;
    }

    .legend {
      margin: 0;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
    }
    .legend[hidden] { display: none; }

    .badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .badges:not(:has(:not([hidden]))) { display: none; } /* 뱃지가 하나도 없으면 자리도 차지하지 않게 */

    .shiny {
      margin: 0;
      padding: 4px 12px;
      border-radius: 999px;
      background: #1F2328;
      color: #FFD54A;
      font-size: 13px;
      font-weight: 700;
    }
    .shiny[hidden] { display: none; }

    /* 이로치 이름: 무지개 그라디언트를 글자 모양으로 잘라내고, 옆으로 흘러가게 */
    .poke-name.rainbow {
      background: linear-gradient(90deg,
        #E53935, #FB8C00, #FDD835, #43A047, #1E88E5, #5E35B1, #D81B60, #E53935);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbow-flow 2.5s linear infinite;
    }
    @keyframes rainbow-flow {
      to { background-position: 200% center; }
    }
    /* 움직임을 줄이도록 설정한 사용자에게는 애니메이션 없이 무지개색만 */
    @media (prefers-reduced-motion: reduce) {
      .poke-name.rainbow { animation: none; }
    }

    .types { display: flex; gap: 8px; min-height: 32px; }
    .type-badge {
      padding: 4px 14px;
      border: 2px solid currentColor; /* 테두리를 글자색과 같게 */
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .btn-reroll {
      margin-top: 8px;
      width: 100%;
      max-width: 320px;
      height: 52px;
      border: 0;
      border-radius: 26px;
      background: var(--accent);
      color: #FFFFFF;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: default; }

    /* 스크린 리더에게만 보이는 라벨 */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* 휴대폰 화면 */
    @media (max-width: 600px) {
      .page { padding: 24px 16px; gap: 20px; }
      .weather-card, .pokemon-card { padding: 28px; border-radius: 24px; }
      .label { font-size: 40px; }
      .poke-name { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>포켓몬 날씨</h1>

      <!-- 위치 설정: 도시 검색 또는 현재 위치 -->
      <div class="search-area">
        <form id="search-form" class="search">
          <label for="search-input" class="sr-only">도시 검색</label>
          <input id="search-input" type="text" placeholder="도시 이름 (서울, Tokyo)" autocomplete="off" />
          <button type="submit" class="btn-search">검색</button>
          <button type="button" id="gps-button" class="btn-icon" aria-label="현재 위치">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A515B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path>
              <circle cx="12" cy="9.5" r="2.5"></circle>
            </svg>
          </button>
        </form>
        <ul id="search-results" class="results"></ul>
      </div>
    </header>

    <main class="panels">
      <!-- 날씨 블록 -->
      <section class="weather-card" aria-live="polite">
        <p id="w-location" class="location">&nbsp;</p>
        <p id="w-temp" class="temp">--°</p>
        <p id="w-label" class="label">불러오는 중</p>
        <p id="w-hint" class="hint">&nbsp;</p>
        <p id="w-odds" class="odds">&nbsp;</p>
      </section>

      <!-- 포켓몬 블록 -->
      <section class="pokemon-card" aria-live="polite">
        <div class="poke-image">
          <img id="p-image" alt="" />
          <span id="p-status"></span>
        </div>
        <div class="badges">
          <p id="p-shiny" class="shiny" hidden>이로치 등장!</p>
          <p id="p-legend" class="legend" hidden>전설 등장!</p>
        </div>
        <h2 id="p-name" class="poke-name">&nbsp;</h2>
        <div id="p-types" class="types"></div>
        <button type="button" id="reroll-button" class="btn-reroll">다시 뽑기</button>
      </section>
    </main>
  </div>

  <script>
    // 화면 요소들
    const wLocation = document.getElementById('w-location');
    const wTemp = document.getElementById('w-temp');
    const wLabel = document.getElementById('w-label');
    const wHint = document.getElementById('w-hint');
    const wOdds = document.getElementById('w-odds');

    const pImage = document.getElementById('p-image');
    const pStatus = document.getElementById('p-status');
    const pName = document.getElementById('p-name');
    const pLegend = document.getElementById('p-legend');
    const pShiny = document.getElementById('p-shiny');
    const pTypes = document.getElementById('p-types');
    const rerollButton = document.getElementById('reroll-button');

    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const gpsButton = document.getElementById('gps-button');

    // 저장된 위치가 없을 때 쓸 기본값 (서울 시청)
    const DEFAULT_LOCATION = { lat: 37.5665, lon: 126.978, name: '서울' };
    const STORAGE_KEY = 'pokemon-weather:location';

    // 위치 저장/불러오기 (localStorage)
    // 사생활 보호 모드 등에서는 localStorage가 에러를 낼 수 있어서 try/catch로 감싸요
    function loadSavedLocation() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : null;
      } catch {
        return null;
      }
    }

    function saveLocation(location) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(location));
      } catch {
        // 저장 못 해도 앱은 계속 동작해요
      }
    }

    // 2단계: 현재 위치 (버튼을 눌렀을 때만 사용)
    // 콜백 방식인 getCurrentPosition을 Promise로 감싸요
    function getCurrentPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('이 브라우저는 위치 기능을 지원하지 않아요'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            name: '현재 위치',
          }),
          (err) => reject(err),
          {
            timeout: 5000,          // 5초만 기다려요
            maximumAge: 10 * 60000, // 10분 안에 받은 위치가 있으면 재사용
          }
        );
      });
    }

    // 좌표 → 지역 이름 (역지오코딩)
    // Open-Meteo는 이 방향을 지원하지 않아서 BigDataCloud의 무료 API를 써요.
    // 키는 필요 없고, '사용자 기기에서 위치를 받은 직후' 부르는 용도로 만들어진 API예요.
    async function reverseGeocode(lat, lon) {
      const params = new URLSearchParams({
        latitude: lat,
        longitude: lon,
        localityLanguage: 'ko',
      });
      const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?${params}`);
      if (!res.ok) throw new Error(`역지오코딩 오류: ${res.status}`);
      const data = await res.json();

      // city가 비어 있는 경우가 있어서 locality로 대체해요
      // 예: '성남시, 경기도'
      const place = data.city || data.locality;
      return [place, data.principalSubdivision].filter(Boolean).join(', ');
    }

    // 도시 이름 → 좌표 (Open-Meteo 지오코딩 API, 키 필요 없음)
    async function searchCity(query) {
      const params = new URLSearchParams({
        name: query,
        count: 5,
        language: 'ko',
      });
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?${params}`);
      if (!res.ok) throw new Error(`지오코딩 API 오류: ${res.status}`);
      const data = await res.json();

      // 결과가 없으면 results 필드 자체가 없어요
      return (data.results || []).map((r) => ({
        lat: r.latitude,
        lon: r.longitude,
        // '광주, 경기도, 대한민국'처럼 구분할 수 있게 지역명까지 붙여요
        name: [r.name, r.admin1, r.country].filter(Boolean).join(', '),
      }));
    }

    // 3단계: Open-Meteo에서 현재 날씨 가져오기
    async function getWeather(lat, lon) {
      // URLSearchParams를 쓰면 ?a=1&b=2 같은 쿼리 문자열을 안전하게 만들어줘요
      const params = new URLSearchParams({
        latitude: lat,
        longitude: lon,
        current: 'temperature_2m,relative_humidity_2m,weather_code,is_day',
        daily: 'temperature_2m_max,temperature_2m_min', // 오늘 최고/최저기온 (표시용)
        forecast_days: 1,
        timezone: 'auto',
      });
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);

      // fetch는 404, 500 같은 에러 응답에도 '성공'으로 끝나요.
      // 그래서 res.ok로 직접 확인해야 해요.
      if (!res.ok) throw new Error(`날씨 API 오류: ${res.status}`);

      const data = await res.json();
      console.log('날씨 원본 응답:', data);

      // 필요한 값만 골라서 돌려줘요
      return {
        temperature: data.current.temperature_2m,
        humidity: data.current.relative_humidity_2m,
        maxTemp: data.daily.temperature_2m_max[0],
        minTemp: data.daily.temperature_2m_min[0],
        code: data.current.weather_code,
        isDay: data.current.is_day === 1,
      };
    }

    // 4단계: WMO 날씨 코드 → 우리 앱의 날씨 분류
    // 분류별 표시 이름과 테마 색(bg: 배경, accent: 날씨 블록)
    const WEATHER_INFO = {
      clear:        { label: '맑음',   bg: '#FFF4E0', accent: '#C2410C' },
      clouds:       { label: '흐림',   bg: '#EEF0F3', accent: '#5B6472' },
      fog:          { label: '안개',   bg: '#F0EEF6', accent: '#5B4A8A' },
      drizzle:      { label: '이슬비', bg: '#E6F4EE', accent: '#2F7D5B' },
      rain:         { label: '비',     bg: '#E3F0FB', accent: '#1C6FB8' },
      snow:         { label: '눈',     bg: '#EEF7FA', accent: '#22708C' },
      thunderstorm: { label: '뇌우',   bg: '#FFF8D6', accent: '#8A6500' },
    };

    function classifyWeather(code) {
      if (code <= 1) return 'clear';                       // 0, 1
      if (code <= 3) return 'clouds';                      // 2, 3
      if (code === 45 || code === 48) return 'fog';
      if (code >= 51 && code <= 57) return 'drizzle';
      if (code >= 61 && code <= 67) return 'rain';
      if (code >= 71 && code <= 77) return 'snow';
      if (code >= 80 && code <= 82) return 'rain';         // 소나기
      if (code >= 85 && code <= 86) return 'snow';         // 눈 소나기
      if (code >= 95 && code <= 99) return 'thunderstorm';

      // 표에 없는 코드가 오면 앱이 멈추지 않게 흐림으로 처리
      console.warn('알 수 없는 날씨 코드:', code);
      return 'clouds';
    }

    // 5단계: 점수제 출현 규칙
    //
    // 날씨, 기온, 습도가 각각 타입에 점수를 줘요.
    // 점수를 다 더한 다음 비율(%)로 바꿔서 뽑기 확률로 써요.

    // (1) 날씨 → 타입 점수
    //     비, 뇌우, 눈처럼 날씨가 뚜렷한 날은 점수를 크게 줘요
    const WEATHER_SCORES = {
      clear:        { grass: 6 },
      clouds:       { flying: 6 },
      fog:          { ghost: 6, psychic: 6 },
      drizzle:      { bug: 6 },
      rain:         { water: 10 },
      snow:         { ice: 10 },
      thunderstorm: { electric: 10 },
    };

    // (2) 현재 기온 → 타입 점수
    //     구간이 겹쳐도 돼요. 해당하는 구간의 타입이 전부 점수를 받아요.
    //     (from 이상, to 미만)
    const TEMP_RULES = [
      { to: 5,             types: ['ice'],                score: 3 },
      { from: 0,  to: 10,  types: ['steel'],              score: 3 },
      { from: 5,  to: 20,  types: ['normal', 'fighting'], score: 3 },
      { from: 15, to: 25,  types: ['fairy'],              score: 3 },
      { from: 20, to: 30,  types: ['grass'],              score: 3 },
      { from: 25, to: 30,  types: ['bug'],                score: 3 },
      // 불꽃: 30°에서 5점, 1°마다 +1점
      { from: 30,          types: ['fire'], score: (t) => 5 + (t - 30) },
    ];

    // (3) 습도 → 타입 점수
    //     습함: 60%에서 1점, 10%마다 +1점 (100%면 5점) → 물
    //     건조: 40%에서 1점, 10% 내려갈 때마다 +1점 (0%면 5점) → 땅, 바위
    function humidityScores(humidity) {
      if (humidity >= 60) {
        return { water: 1 + Math.floor((humidity - 60) / 10) };
      }
      if (humidity <= 40) {
        const score = 1 + Math.floor((40 - humidity) / 10);
        return { ground: score, rock: score };
      }
      return {};
    }

    // 모든 조건의 점수를 합쳐요 → { fire: 7, grass: 6, water: 2 }
    function calcTypeScores(category, temp, humidity) {
      const scores = {};
      const add = (type, score) => {
        scores[type] = (scores[type] || 0) + score;
      };

      for (const [type, score] of Object.entries(WEATHER_SCORES[category])) {
        add(type, score);
      }
      for (const rule of TEMP_RULES) {
        const from = rule.from ?? -Infinity;
        const to = rule.to ?? Infinity;
        if (temp < from || temp >= to) continue;
        const score = typeof rule.score === 'function' ? rule.score(temp) : rule.score;
        for (const type of rule.types) add(type, score);
      }
      for (const [type, score] of Object.entries(humidityScores(humidity))) {
        add(type, score);
      }
      return scores;
    }

    // 점수 → 비율 (합이 1이 되게)
    function toShares(scores) {
      const total = Object.values(scores).reduce((sum, s) => sum + s, 0);
      const shares = {};
      for (const [type, score] of Object.entries(scores)) shares[type] = score / total;
      return shares;
    }

    // 맑은 날 배경/블록 색 (현재 기온 기준)
    const CLEAR_THEMES = [
      { below: 5,        bg: '#EAF4FB', accent: '#1F6C9E' },
      { below: 15,       bg: '#F5F0E6', accent: '#7A5C2E' },
      { below: 25,       bg: '#EEF6E4', accent: '#3F7A1F' },
      { below: Infinity, bg: '#FFF4E0', accent: '#C2410C' },
    ];

    function clearTheme(temp) {
      return CLEAR_THEMES.find((theme) => temp < theme.below);
    }

    // 배열에서 아무거나 하나 고르기
    function randomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // 가중치 랜덤: [{ weight, ... }] 중 weight에 비례해서 하나 고르기
    function weightedPick(items) {
      const total = items.reduce((sum, item) => sum + item.weight, 0);
      let r = Math.random() * total;
      for (const item of items) {
        r -= item.weight;
        if (r < 0) return item;
      }
      return items[items.length - 1]; // 소수점 오차 대비
    }

    // 7단계: 타입 한국어 이름과 뱃지 색 (흰 배경에서 잘 읽히는 진한 색)
    const TYPE_INFO = {
      normal:   { label: '노말',   color: '#5B6472' },
      fire:     { label: '불꽃',   color: '#C2410C' },
      water:    { label: '물',     color: '#1C6FB8' },
      electric: { label: '전기',   color: '#8A6500' },
      grass:    { label: '풀',     color: '#2F7D5B' },
      ice:      { label: '얼음',   color: '#22708C' },
      fighting: { label: '격투',   color: '#A02C2C' },
      poison:   { label: '독',     color: '#7B3FA0' },
      ground:   { label: '땅',     color: '#8A5A1F' },
      flying:   { label: '비행',   color: '#5B5FA8' },
      psychic:  { label: '에스퍼', color: '#B0306A' },
      bug:      { label: '벌레',   color: '#5F7A12' },
      rock:     { label: '바위',   color: '#7A6A3A' },
      ghost:    { label: '고스트', color: '#5B4A8A' },
      dragon:   { label: '드래곤', color: '#4B3FB5' },
      dark:     { label: '악',     color: '#3F3A36' },
      steel:    { label: '강철',   color: '#4F6470' },
      fairy:    { label: '페어리', color: '#A63C7E' },
    };

    // 6단계: 도감 데이터에서 포켓몬 뽑기
    //
    // 도감 데이터(pokedex.json)는 build-pokedex.mjs로 미리 만들어 둔 파일이에요.
    //   [{ "name": "vulpix-alola", "id": 10103, "ko": "식스테일 (알로라폼)", "types": ["ice"] }, ...]
    // 그래서 포켓몬을 뽑을 때 PokeAPI를 부를 필요가 없어요.
    // (file://로 열면 브라우저가 fetch를 막으니 Live Server 같은 로컬 서버로 열어야 해요)

    let pokedexPromise = null; // 한 번 읽은 파일은 다시 읽지 않아요

    function loadPokedex() {
      if (!pokedexPromise) {
        pokedexPromise = fetch('./pokedex.json').then((res) => {
          if (!res.ok) throw new Error(`pokedex.json을 못 읽었어요: ${res.status}`);
          return res.json();
        });
        // 실패하면 다음에 다시 시도할 수 있게 비워둬요
        pokedexPromise.catch(() => { pokedexPromise = null; });
      }
      return pokedexPromise;
    }

    // 전설·환상 포켓몬은 일반 뽑기에서 빼고, 2% 확률의 별도 이벤트로 나와요
    // 주소 끝에 ?legend 를 붙이면 테스트용으로 항상 전설 이벤트가 발동해요
    const LEGEND_RATE = 0.02;
    const FORCE_LEGEND = new URLSearchParams(window.location.search).has('legend');

    // 묶음 크기 보정: 이 마릿수보다 적은 묶음은 그만큼 확률이 줄어요
    // (2마리짜리 묶음 → 확률 10%만 남음)
    const FULL_BUCKET_SIZE = 20;

    // 묶음 이름: 'fire' 또는 'fire+grass' (알파벳 순으로 정렬해서 하나로 통일)
    function bucketKey(types) {
      return [...types].sort().join('+');
    }

    // 도감을 묶음별로 나눠둬요 (전설과 일반을 따로)
    let bucketsPromise = null;

    function getBuckets() {
      if (!bucketsPromise) {
        bucketsPromise = loadPokedex().then((pokedex) => {
          const normal = {};
          const legends = [];
          for (const pokemon of pokedex) {
            if (pokemon.legend) {
              legends.push(pokemon);
              continue;
            }
            const key = bucketKey(pokemon.types);
            if (!normal[key]) normal[key] = [];
            normal[key].push(pokemon);
          }
          return { normal, legends };
        });
        bucketsPromise.catch(() => { bucketsPromise = null; });
      }
      return bucketsPromise;
    }

    // 점수 → 묶음별 확률
    //
    // 타입을 점수 비율대로 '두 번 뽑는다'고 생각해요.
    //   같은 타입 두 번  → 단일 (확률 p²)
    //   서로 다른 타입  → 복합 (확률 2 × p1 × p2)
    // 복합인데 해당 포켓몬이 없으면 → 점수가 높은 쪽 단일로 넘겨요.
    // 마지막으로 마릿수가 적은 묶음은 확률을 줄여요.
    function calcBucketWeights(scores, buckets) {
      const shares = toShares(scores);
      const types = Object.keys(shares);
      const weights = {};
      const add = (key, w) => {
        weights[key] = (weights[key] || 0) + w;
      };

      for (let i = 0; i < types.length; i++) {
        for (let j = i; j < types.length; j++) {
          const a = types[i];
          const b = types[j];
          if (a === b) {
            add(a, shares[a] * shares[a]);
            continue;
          }
          const w = 2 * shares[a] * shares[b];
          const key = bucketKey([a, b]);
          if (buckets[key]) add(key, w);
          else add(scores[a] >= scores[b] ? a : b, w); // 없는 조합 → 점수 높은 쪽 단일
        }
      }

      // 묶음 크기 보정 + 빈 묶음 제거
      const result = [];
      for (const [key, w] of Object.entries(weights)) {
        const members = buckets[key];
        if (!members) continue;
        const sizeFactor = Math.min(members.length, FULL_BUCKET_SIZE) / FULL_BUCKET_SIZE;
        result.push({ key, members, weight: w * sizeFactor });
      }
      return result;
    }

    async function getRandomPokemon(scores) {
      const { normal, legends } = await getBuckets();

      // 1) 전설 이벤트: 오늘 점수를 받은 타입만으로 이루어진 전설이 후보
      if (FORCE_LEGEND || Math.random() < LEGEND_RATE) {
        const candidates = legends.filter((p) => p.types.every((t) => scores[t]));
        console.log(`전설 이벤트! 후보 ${candidates.length}마리`);
        if (candidates.length > 0) {
          return { ...randomItem(candidates), legend: true };
        }
      }

      // 2) 일반 뽑기: 묶음을 확률대로 고르고, 그 안에서 균등하게
      const bucketWeights = calcBucketWeights(scores, normal);
      if (bucketWeights.length === 0) throw new Error('후보 포켓몬이 없어요');

      const total = bucketWeights.reduce((sum, b) => sum + b.weight, 0);
      console.table(
        bucketWeights
          .map((b) => ({ 묶음: b.key, 마릿수: b.members.length, 확률: `${((b.weight / total) * 100).toFixed(1)}%` }))
          .sort((x, y) => parseFloat(y.확률) - parseFloat(x.확률))
      );

      const bucket = weightedPick(bucketWeights);
      return { ...randomItem(bucket.members), legend: false };
    }

    // 이로치(색이 다른 포켓몬) 확률
    // 주소 끝에 ?shiny 를 붙이면 테스트용으로 항상 이로치가 나와요
    const SHINY_RATE = 0.01;
    const FORCE_SHINY = new URLSearchParams(window.location.search).has('shiny');

    function rollShiny() {
      return FORCE_SHINY || Math.random() < SHINY_RATE;
    }

    // 스프라이트 주소: 도감 번호만 있으면 만들 수 있어요
    const SPRITES = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon';

    // 시도할 이미지 주소를 순서대로 나열해요
    //   이로치: 움직이는 이로치 → 정지 이로치 → (이로치 이미지가 없으면) 일반 이미지
    //   일반:   움직이는 도트 → 정지 도트
    function spriteUrls(id, shiny) {
      const normal = [
        `${SPRITES}/other/showdown/${id}.gif`,
        `${SPRITES}/${id}.png`,
      ];
      if (!shiny) return normal;
      return [
        `${SPRITES}/other/showdown/shiny/${id}.gif`,
        `${SPRITES}/shiny/${id}.png`,
        ...normal,
      ];
    }

    // 목록의 첫 주소부터 시도하고, 실패(404)하면 다음 주소로 넘어가요
    function showSprite(id, alt, shiny) {
      const urls = spriteUrls(id, shiny);
      let index = 0;

      pImage.alt = alt;
      pImage.onerror = () => {
        index++;
        if (index < urls.length) {
          pImage.src = urls[index];
        } else {
          pImage.onerror = null; // 전부 실패하면 멈춰요 (무한 반복 방지)
        }
      };
      pImage.src = urls[0];
    }

    // ---------- 화면 그리기 ----------

    // 날씨 테마 적용: CSS 변수만 바꾸면 배경, 블록, 버튼 색이 다 바뀌어요
    function applyTheme(theme) {
      document.body.style.setProperty('--bg', theme.bg);
      document.body.style.setProperty('--accent', theme.accent);
    }

    // 타입 뱃지 만들기
    function renderTypes(types) {
      pTypes.innerHTML = '';
      for (const type of types) {
        const info = TYPE_INFO[type] || { label: type, color: '#5B6472' };
        const badge = document.createElement('span');
        badge.className = 'type-badge';
        badge.textContent = info.label;
        badge.style.color = info.color;
        pTypes.appendChild(badge);
      }
    }

    function typeLabel(type) {
      return TYPE_INFO[type] ? TYPE_INFO[type].label : type;
    }

    // 지금 타입 점수 (다시 뽑기 버튼에서 사용)
    let currentScores = null; // { fire: 7, grass: 6, water: 2 }

    // 포켓몬만 다시 그리기
    // 이로치가 나오면 다시 뽑기 버튼을 잠깐 잠가요 (실수로 넘기지 않게)
    const SHINY_LOCK_SECONDS = 3;
    const REROLL_LABEL = '다시 뽑기';
    let lockTimer = null;

    function lockReroll(seconds) {
      let left = seconds;
      rerollButton.disabled = true;
      rerollButton.textContent = `${left}초 후 다시 뽑기`;

      // 1초마다 숫자를 줄이고, 0이 되면 풀어줘요
      lockTimer = setInterval(() => {
        left--;
        if (left > 0) {
          rerollButton.textContent = `${left}초 후 다시 뽑기`;
        } else {
          unlockReroll();
        }
      }, 1000);
    }

    function unlockReroll() {
      clearInterval(lockTimer);
      lockTimer = null;
      rerollButton.disabled = false;
      rerollButton.textContent = REROLL_LABEL;
    }

    async function showPokemon(scores) {
      let shiny = false;

      // 잠금 중에 도시를 바꿔서 새로 뽑는 경우, 이전 카운트다운은 정리해요
      if (lockTimer) unlockReroll();

      // 로딩 상태
      rerollButton.disabled = true;
      pImage.removeAttribute('src');
      pStatus.textContent = pokedexPromise ? '찾는 중...' : '도감 준비 중...';
      pName.innerHTML = '&nbsp;';
      pName.classList.remove('rainbow');
      pLegend.hidden = true;
      pShiny.hidden = true;
      renderTypes([]);

      try {
        const pokemon = await getRandomPokemon(scores);
        console.log('뽑힌 포켓몬:', pokemon);

        shiny = rollShiny();
        if (shiny) console.log('이로치 등장!');

        showSprite(pokemon.id, shiny ? `${pokemon.ko} (이로치)` : pokemon.ko, shiny);
        pShiny.hidden = !shiny;
        pStatus.textContent = '';
        pName.textContent = pokemon.ko;
        pName.classList.toggle('rainbow', shiny); // 이로치면 무지개 이름
        pLegend.hidden = !pokemon.legend;
        renderTypes(pokemon.types);
      } catch (err) {
        console.error(err);
        pStatus.textContent = '포켓몬을 찾지 못했어요';
      } finally {
        if (shiny) lockReroll(SHINY_LOCK_SECONDS);
        else rerollButton.disabled = false;
      }
    }

    // 타입 비중 표시: '불꽃 47% · 풀 40% · 물 13%' (높은 순)
    function formatShares(scores) {
      const shares = toShares(scores);
      return Object.entries(shares)
        .sort((a, b) => b[1] - a[1])
        .map(([type, share]) => `${typeLabel(type)} ${Math.round(share * 100)}%`)
        .join(' · ');
    }

    // 위치를 받아서 날씨 → 포켓몬까지 화면에 그려요
    async function showWeatherAndPokemon(location) {
      wLocation.textContent = location.name;
      wTemp.textContent = '--°';
      wLabel.textContent = '불러오는 중';
      wHint.innerHTML = '&nbsp;';
      wOdds.innerHTML = '&nbsp;';

      try {
        const weather = await getWeather(location.lat, location.lon);
        const category = classifyWeather(weather.code);
        const info = WEATHER_INFO[category];
        console.log(`날씨 코드 ${weather.code} → ${category}`);

        // 화면에 보이는 숫자와 규칙 판단을 같은 값으로 맞춰요 (반올림)
        const temp = Math.round(weather.temperature);
        const humidity = Math.round(weather.humidity);
        const scores = calcTypeScores(category, temp, humidity);
        console.log('타입 점수:', scores);

        // 맑은 날은 기온에 따른 색, 나머지는 날씨 색
        applyTheme(category === 'clear' ? clearTheme(temp) : info);

        wTemp.textContent = `${temp}°`;
        wLabel.textContent = info.label;
        wHint.textContent =
          `최고 ${Math.round(weather.maxTemp)}° · 최저 ${Math.round(weather.minTemp)}° · 습도 ${humidity}%`;
        wOdds.textContent = `타입 비중  ${formatShares(scores)}`;

        currentScores = scores;
        await showPokemon(scores);
      } catch (err) {
        console.error(err);
        wLabel.textContent = '날씨 오류';
        wHint.textContent = '날씨를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
      }
    }
    // ---------- 이벤트 ----------

    // 위치를 고르면: 저장하고 → 검색 결과 지우고 → 다시 그리기
    function selectLocation(location) {
      saveLocation(location);
      searchResults.innerHTML = '';
      searchInput.value = '';
      showWeatherAndPokemon(location);
    }

    // 검색 결과 목록에 안내 문구 한 줄 보여주기
    function showResultMessage(text) {
      searchResults.innerHTML = '';
      const li = document.createElement('li');
      li.className = 'msg';
      li.textContent = text;
      searchResults.appendChild(li);
    }

    // 도시 검색
    searchForm.addEventListener('submit', async (event) => {
      event.preventDefault(); // form 기본 동작(페이지 새로고침) 막기

      const query = searchInput.value.trim();
      if (!query) return;

      showResultMessage('검색 중...');
      try {
        const results = await searchCity(query);

        if (results.length === 0) {
          showResultMessage('결과가 없어요. 영어로도 검색해 보세요.');
          return;
        }

        // 결과마다 버튼을 만들어요.
        // 이름은 외부 데이터라 innerHTML 대신 textContent로 넣어요 (안전)
        searchResults.innerHTML = '';
        for (const location of results) {
          const li = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = location.name;
          button.addEventListener('click', () => selectLocation(location));
          li.appendChild(button);
          searchResults.appendChild(li);
        }
      } catch (err) {
        console.error(err);
        showResultMessage('검색에 실패했어요.');
      }
    });

    // 현재 위치 버튼
    gpsButton.addEventListener('click', async () => {
      gpsButton.disabled = true;
      gpsButton.setAttribute('aria-label', '현재 위치 찾는 중');
      try {
        const location = await getCurrentPosition();

        // 지역 이름을 못 가져와도 날씨는 보여줘야 하니까 실패는 여기서 따로 잡아요
        try {
          const placeName = await reverseGeocode(location.lat, location.lon);
          if (placeName) location.name = placeName;
        } catch (err) {
          console.warn('지역 이름을 못 가져왔어요:', err.message);
        }

        selectLocation(location);
      } catch (err) {
        console.warn('위치를 못 가져왔어요:', err.message);
        showResultMessage('현재 위치를 찾지 못했어요. 도시 이름으로 검색해 주세요.');
      } finally {
        gpsButton.disabled = false;
        gpsButton.setAttribute('aria-label', '현재 위치');
      }
    });

    // 다시 뽑기: 날씨는 그대로, 포켓몬만 새로
    rerollButton.addEventListener('click', () => {
      if (currentScores) showPokemon(currentScores);
    });

    // 앱 시작: 저장된 위치가 있으면 그걸, 없으면 서울로 바로 시작
    showWeatherAndPokemon(loadSavedLocation() || DEFAULT_LOCATION);
  </script>
</body>
