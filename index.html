<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포켓몬 날씨</title>

  <!-- 웹폰트: 큰 숫자/제목용 Do Hyeon, 본문용 Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>포켓몬 날씨</h1>

      <!-- 위치 설정: 도시 검색 또는 현재 위치 -->
      <div class="search-area">
        <form id="search-form" class="search">
          <label for="search-input" class="sr-only">도시 검색</label>
          <input id="search-input" type="text" placeholder="도시 이름 (서울, Tokyo)" autocomplete="off" />
          <button type="submit" class="btn-search">검색</button>
          <button type="button" id="gps-button" class="btn-icon" aria-label="현재 위치">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A515B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path>
              <circle cx="12" cy="9.5" r="2.5"></circle>
            </svg>
          </button>
        </form>
        <ul id="search-results" class="results"></ul>
      </div>
    </header>

    <main class="panels">
      <!-- 날씨 블록 -->
      <section class="weather-card" aria-live="polite">
        <p id="w-location" class="location">&nbsp;</p>
        <p id="w-temp" class="temp">--°</p>
        <p id="w-label" class="label">불러오는 중</p>
        <p id="w-hint" class="hint">&nbsp;</p>
        <p id="w-odds" class="odds">&nbsp;</p>
      </section>

      <!-- 포켓몬 블록 -->
      <section class="pokemon-card" aria-live="polite">
        <div class="poke-image">
          <img id="p-image" alt="" />
          <span id="p-status"></span>
        </div>
        <div class="badges">
          <p id="p-shiny" class="shiny" hidden>이로치 등장!</p>
          <p id="p-legend" class="legend" hidden>전설 등장!</p>
        </div>
        <h2 id="p-name" class="poke-name">&nbsp;</h2>
        <div id="p-types" class="types"></div>
        <button type="button" id="reroll-button" class="btn-reroll">다시 뽑기</button>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
